name: Daily Check-in

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC is 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enable Cloudflare WARP egress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/cloudflare-warp.deb \
            https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.6.880.0_amd64.deb
          echo '648a7c7e9085f8e50d32a2adcacb0c2049fb72ebeb02ebe913becadee3ab0d4c  /tmp/cloudflare-warp.deb' \
            | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/cloudflare-warp.deb
          sudo systemctl enable --now warp-svc
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect
          connected=false
          for _ in {1..30}; do
            if sudo warp-cli --accept-tos status | grep -qi connected; then
              connected=true
              break
            fi
            sleep 2
          done
          if [ "$connected" != true ]; then
            sudo warp-cli --accept-tos status
            exit 1
          fi
          test "$(curl -fsS --retry 5 https://www.cloudflare.com/cdn-cgi/trace \
            | sed -n 's/^warp=//p')" = on

      - name: Run daily check-in
        env:
          # AnyRouter 单账号（旧配置，继续兼容）
          ANYROUTER_USER_ID: ${{ secrets.ANYROUTER_USER_ID }}
          ANYROUTER_COOKIE: ${{ secrets.ANYROUTER_COOKIE }}
          # AnyRouter 多账号：按需在仓库 Secrets 中添加对应编号；未配置的编号会被自动跳过。
          # 如需超过 5 个账号，按同样格式继续追加。
          ANYROUTER_USER_ID1: ${{ secrets.ANYROUTER_USER_ID1 }}
          ANYROUTER_COOKIE1: ${{ secrets.ANYROUTER_COOKIE1 }}
          ANYROUTER_USER_ID2: ${{ secrets.ANYROUTER_USER_ID2 }}
          ANYROUTER_COOKIE2: ${{ secrets.ANYROUTER_COOKIE2 }}
          ANYROUTER_USER_ID3: ${{ secrets.ANYROUTER_USER_ID3 }}
          ANYROUTER_COOKIE3: ${{ secrets.ANYROUTER_COOKIE3 }}
          ANYROUTER_USER_ID4: ${{ secrets.ANYROUTER_USER_ID4 }}
          ANYROUTER_COOKIE4: ${{ secrets.ANYROUTER_COOKIE4 }}
          ANYROUTER_USER_ID5: ${{ secrets.ANYROUTER_USER_ID5 }}
          ANYROUTER_COOKIE5: ${{ secrets.ANYROUTER_COOKIE5 }}
          # AgentRouter 账号：LINUXDO_COOKIE 用于 OAuth 签到中继，COOKIE 是降级路径。
          # 至少要配一个 cookie；两个都配则优先中继，失败自动降级。
          AGENTROUTER_USER_ID: ${{ secrets.AGENTROUTER_USER_ID }}
          AGENTROUTER_LINUXDO_COOKIE: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE }}
          AGENTROUTER_GITHUB_COOKIE: ${{ secrets.AGENTROUTER_GITHUB_COOKIE }}
          AGENTROUTER_COOKIE: ${{ secrets.AGENTROUTER_COOKIE }}
          AGENTROUTER_USER_ID1: ${{ secrets.AGENTROUTER_USER_ID1 }}
          AGENTROUTER_LINUXDO_COOKIE1: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE1 }}
          AGENTROUTER_GITHUB_COOKIE1: ${{ secrets.AGENTROUTER_GITHUB_COOKIE1 }}
          AGENTROUTER_COOKIE1: ${{ secrets.AGENTROUTER_COOKIE1 }}
          AGENTROUTER_USER_ID2: ${{ secrets.AGENTROUTER_USER_ID2 }}
          AGENTROUTER_LINUXDO_COOKIE2: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE2 }}
          AGENTROUTER_GITHUB_COOKIE2: ${{ secrets.AGENTROUTER_GITHUB_COOKIE2 }}
          AGENTROUTER_COOKIE2: ${{ secrets.AGENTROUTER_COOKIE2 }}
          AGENTROUTER_USER_ID3: ${{ secrets.AGENTROUTER_USER_ID3 }}
          AGENTROUTER_LINUXDO_COOKIE3: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE3 }}
          AGENTROUTER_GITHUB_COOKIE3: ${{ secrets.AGENTROUTER_GITHUB_COOKIE3 }}
          AGENTROUTER_COOKIE3: ${{ secrets.AGENTROUTER_COOKIE3 }}
          AGENTROUTER_USER_ID4: ${{ secrets.AGENTROUTER_USER_ID4 }}
          AGENTROUTER_LINUXDO_COOKIE4: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE4 }}
          AGENTROUTER_GITHUB_COOKIE4: ${{ secrets.AGENTROUTER_GITHUB_COOKIE4 }}
          AGENTROUTER_COOKIE4: ${{ secrets.AGENTROUTER_COOKIE4 }}
          AGENTROUTER_USER_ID5: ${{ secrets.AGENTROUTER_USER_ID5 }}
          AGENTROUTER_LINUXDO_COOKIE5: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE5 }}
          AGENTROUTER_GITHUB_COOKIE5: ${{ secrets.AGENTROUTER_GITHUB_COOKIE5 }}
          AGENTROUTER_COOKIE5: ${{ secrets.AGENTROUTER_COOKIE5 }}
          # PushPlus 推送（所有站点共用一个 token）
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python checkin.py

      - name: Disconnect Cloudflare WARP
        if: always()
        shell: bash
        run: |
          sudo warp-cli --accept-tos disconnect || true
          sudo warp-cli --accept-tos registration delete || true
