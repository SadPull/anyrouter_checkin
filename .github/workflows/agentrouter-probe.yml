name: AgentRouter Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare WARP
        if: runner.os == 'Linux'
        uses: fscarmen/warp-on-actions@37ce1997e075435a827991dabcce1d080c1fe512
        with:
          stack: ipv4
          mode: wireguard

      - name: Show WARP status
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --silent --show-error https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)='

      - name: Probe public endpoints with Python
        shell: python
        run: |
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://agentrouter.org/console",
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/150.0.0.0 Safari/537.36"
              ),
          }
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(base + "/api/status", headers=headers)
              try:
                  response = urllib.request.urlopen(request, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "arg1=", "var arg1=" in body,
                  "prefix=", repr(body[:120]),
              )

      - name: Probe public endpoints with curl
        shell: bash
        run: |
          for base in https://agentrouter.org https://ps.air-outer.com; do
            echo "$base"
            curl --silent --show-error --compressed \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36' \
              --header 'Accept: application/json, text/plain, */*' \
              --referer "$base/console" \
              --dump-header - \
              --output response.txt \
              "$base/api/status"
            python -c "from pathlib import Path; body=Path('response.txt').read_text(encoding='utf-8', errors='replace'); print('length=', len(body), 'arg1=', 'var arg1=' in body, 'prefix=', repr(body[:120]))"
          done

      - name: Probe SSXMOD fingerprint cookies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --silent --show-error --location \
            https://raw.githubusercontent.com/xtekky/gpt4free/main/g4f/Provider/qwen/fingerprint.py \
            --output fingerprint.py
          curl --silent --show-error --location \
            https://raw.githubusercontent.com/xtekky/gpt4free/main/g4f/Provider/qwen/cookie_generator.py \
            --output cookie_generator.py
          sed -i '/from g4f import debug/d' cookie_generator.py
          sed -i 's/from g4f.Provider.qwen.fingerprint import generate_fingerprint/from fingerprint import generate_fingerprint/' cookie_generator.py
          python - <<'PY'
          import json
          import re
          import uuid
          import urllib.request
          from cookie_generator import generate_cookies

          generated = generate_cookies(
              fingerprint_options={"platform": "linux", "locale": "zh-CN"}
          )
          cookie = (
              f"ssxmod_itna={generated['ssxmod_itna']}; "
              f"ssxmod_itna2={generated['ssxmod_itna2']}"
          )
          wu_request = urllib.request.Request(
              "https://sg-wum.alibaba.com/w/wu.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          wu_body = urllib.request.urlopen(wu_request, timeout=20).read().decode(
              "utf-8", errors="replace"
          )
          token_match = re.search(r"(?:umx\.wu|__fycb)\('([^']+)'\)", wu_body)
          if not token_match:
              raise RuntimeError("Could not extract bx-umidtoken")
          umid_token = token_match.group(1)
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(
                  base + "/api/status",
                  headers={
                      "Accept": "application/json, text/plain, */*",
                      "Accept-Language": "zh-CN,zh;q=0.9",
                      "Cookie": cookie,
                      "Origin": base,
                      "Referer": base + "/console",
                      "Sec-Fetch-Dest": "empty",
                      "Sec-Fetch-Mode": "cors",
                      "Sec-Fetch-Site": "same-origin",
                      "User-Agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                          "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
                      ),
                      "X-Requested-With": "XMLHttpRequest",
                      "bx-umidtoken": umid_token,
                      "bx-v": "2.5.36",
                      "source": "web",
                      "version": "0.2.63",
                      "x-request-id": str(uuid.uuid4()),
                  },
              )
              response = urllib.request.urlopen(request, timeout=20)
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "json=", body.lstrip().startswith("{"),
                  "prefix=", repr(body[:120]),
              )
          PY

      - name: Probe with a real Chrome session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --quiet selenium
          xvfb-run -a python - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          options = Options()
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-blink-features=AutomationControlled")
          options.add_argument("--window-size=1920,1080")
          options.add_experimental_option("excludeSwitches", ["enable-automation"])
          driver = webdriver.Chrome(options=options)
          try:
              driver.execute_cdp_cmd(
                  "Page.addScriptToEvaluateOnNewDocument",
                  {
                      "source": (
                          "Object.defineProperty(navigator, 'webdriver', "
                          "{get: () => undefined})"
                      )
                  },
              )
              for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
                  driver.get(base + "/api/status")
                  for _ in range(15):
                      body = driver.find_element("tag name", "body").text
                      if body.lstrip().startswith("{"):
                          break
                      time.sleep(1)
                  cookies = [cookie["name"] for cookie in driver.get_cookies()]
                  print(
                      base,
                      "url=", driver.current_url,
                      "json=", body.lstrip().startswith("{"),
                      "length=", len(body),
                      "cookies=", sorted(cookies),
                      "prefix=", repr(body[:120]),
                  )
          finally:
              driver.quit()
          PY

      - name: Probe Claude Code client fingerprint
        if: runner.os == 'Linux'
        shell: python
        run: |
          import urllib.request

          headers = {
              "Accept": "application/json",
              "User-Agent": "claude-cli/2.1.119 (external, cli)",
              "x-app": "cli",
              "X-Stainless-Lang": "js",
              "X-Stainless-Runtime": "node",
              "X-Stainless-Runtime-Version": "v20.10.0",
              "X-Stainless-OS": "Linux",
              "X-Stainless-Arch": "x64",
              "X-Stainless-Package-Version": "0.39.0",
              "anthropic-version": "2023-06-01",
              "anthropic-beta": (
                  "interleaved-thinking-2025-05-14,"
                  "redact-thinking-2026-02-12,"
                  "context-management-2025-06-27,"
                  "prompt-caching-scope-2026-01-05,"
                  "claude-code-20250219"
              ),
              "anthropic-dangerous-direct-browser-access": "true",
          }
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(base + "/api/status", headers=headers)
              response = urllib.request.urlopen(request, timeout=20)
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "json=", body.lstrip().startswith("{"),
                  "prefix=", repr(body[:120]),
              )

      - name: Probe LinuxDO OAuth with real Chrome
        if: runner.os == 'Linux'
        shell: bash
        env:
          AGENTROUTER_LINUXDO_COOKIE: ${{ secrets.AGENTROUTER_LINUXDO_COOKIE }}
          AGENTROUTER_USER_ID: ${{ secrets.AGENTROUTER_USER_ID }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          import checkin

          token_cookie = checkin.select_cookie(
              os.environ.get("AGENTROUTER_LINUXDO_COOKIE", ""),
              {"auth.session-token"},
          )
          if not token_cookie:
              raise RuntimeError("AGENTROUTER_LINUXDO_COOKIE lacks auth.session-token")
          token = token_cookie.split("=", 1)[1]

          provider = checkin.AgentRouterProvider()
          session = checkin.Session(cookie_env="AGENTROUTER_LINUXDO_COOKIE")
          client_id = provider.linuxdo_client_id(session)
          state = provider.oauth_state(session)
          authorize_url = checkin.LINUXDO_AUTHORIZE_URL + "?" + urllib.parse.urlencode(
              {"response_type": "code", "client_id": client_id, "state": state}
          )

          options = Options()
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-blink-features=AutomationControlled")
          options.add_argument("--window-size=1920,1080")
          options.add_experimental_option("excludeSwitches", ["enable-automation"])
          options.set_capability("goog:loggingPrefs", {"performance": "ALL"})
          driver = webdriver.Chrome(options=options)
          code = ""
          try:
              driver.execute_cdp_cmd(
                  "Page.addScriptToEvaluateOnNewDocument",
                  {
                      "source": (
                          "Object.defineProperty(navigator, 'webdriver', "
                          "{get: () => undefined})"
                      )
                  },
              )
              driver.execute_cdp_cmd("Network.enable", {})
              cookie_result = driver.execute_cdp_cmd(
                  "Network.setCookie",
                  {
                      "name": "auth.session-token",
                      "value": token,
                      "url": "https://connect.linux.do/",
                      "path": "/",
                      "secure": True,
                      "httpOnly": True,
                      "sameSite": "Lax",
                  },
              )
              if cookie_result.get("success") is False:
                  raise RuntimeError("Chrome rejected the LinuxDO session cookie")
              driver.get(authorize_url)
              deadline = time.time() + 45
              consent_clicked = False
              controls_logged = False
              while time.time() < deadline and not code:
                  current = urllib.parse.urlparse(driver.current_url)
                  query = urllib.parse.parse_qs(current.query)
                  if current.path == "/oauth/linuxdo" and query.get("code"):
                      code = query["code"][0]
                      break
                  for entry in driver.get_log("performance"):
                      event = json.loads(entry["message"])["message"]
                      if event.get("method") != "Network.requestWillBeSent":
                          continue
                      url = event.get("params", {}).get("request", {}).get("url", "")
                      parsed = urllib.parse.urlparse(url)
                      params = urllib.parse.parse_qs(parsed.query)
                      if parsed.path == "/oauth/linuxdo" and params.get("code"):
                          code = params["code"][0]
                          break
                  if not code and not consent_clicked:
                      candidates = []
                      candidates.extend(driver.find_elements(By.TAG_NAME, "button"))
                      candidates.extend(
                          driver.find_elements(
                              By.CSS_SELECTOR,
                              "input[type='submit'], input[type='button'], a",
                          )
                      )
                      if not controls_logged:
                          controls = []
                          for element in candidates:
                              label = (
                                  element.text
                                  or element.get_attribute("value")
                                  or element.get_attribute("aria-label")
                                  or element.get_attribute("title")
                                  or ""
                              ).strip()
                              if label:
                                  controls.append(
                                      {
                                          "tag": element.tag_name,
                                          "type": element.get_attribute("type") or "",
                                          "label": label[:80],
                                      }
                                  )
                          print("oauth_controls", controls[:20])
                          controls_logged = True
                      for element in candidates:
                          label = (
                              element.text
                              or element.get_attribute("value")
                              or element.get_attribute("aria-label")
                              or element.get_attribute("title")
                              or ""
                          ).strip().lower()
                          if any(
                              word in label
                              for word in (
                                  "授权",
                                  "允许",
                                  "同意",
                                  "确认",
                                  "authorize",
                                  "allow",
                                  "approve",
                                  "confirm",
                                  "continue",
                              )
                          ):
                              href = element.get_attribute("href") or ""
                              if href:
                                  browser_cookie = "; ".join(
                                      f"{cookie['name']}={cookie['value']}"
                                      for cookie in driver.get_cookies()
                                  )
                                  opener = urllib.request.build_opener(
                                      checkin._NoRedirect()
                                  )
                                  request = urllib.request.Request(
                                      href,
                                      headers={
                                          "Accept": (
                                              "text/html,application/xhtml+xml,"
                                              "application/xml;q=0.9,*/*;q=0.8"
                                          ),
                                          "Accept-Language": "zh-CN,zh;q=0.9",
                                          "Cookie": browser_cookie,
                                          "Referer": driver.current_url,
                                          "User-Agent": driver.execute_script(
                                              "return navigator.userAgent"
                                          ),
                                      },
                                  )
                                  try:
                                      response = opener.open(request, timeout=20)
                                      status = response.status
                                      location = response.headers.get("Location") or ""
                                  except urllib.error.HTTPError as error:
                                      status = error.code
                                      location = error.headers.get("Location") or ""
                                  redirect = urllib.parse.urlparse(location)
                                  redirect_query = urllib.parse.parse_qs(
                                      redirect.query
                                  )
                                  if redirect_query.get("code"):
                                      code = redirect_query["code"][0]
                                  print(
                                      "oauth_direct_approve",
                                      "status=", status,
                                      "code_received=", bool(code),
                                  )
                              if not code:
                                  driver.execute_script(
                                      "arguments[0].click();", element
                                  )
                              consent_clicked = True
                              print("oauth_consent_clicked", repr(label[:80]))
                              break
                  time.sleep(1)

              parsed = urllib.parse.urlparse(driver.current_url)
              print(
                  "oauth_browser_result",
                  "code_received=", bool(code),
                  "host=", parsed.netloc,
                  "path=", parsed.path,
                  "title=", repr(driver.title[:80]),
              )
          finally:
              driver.quit()

          if not code:
              raise RuntimeError("Chrome did not receive a LinuxDO authorization code")
          callback = "/api/oauth/linuxdo?" + urllib.parse.urlencode(
              {"code": code, "state": state, "mode": "login"}
          )
          result = provider.request_json(session, callback)
          data = result.get("data") if isinstance(result.get("data"), dict) else {}
          print(
              "oauth_callback",
              "success=", result.get("success"),
              "checked_in=", bool(data.get("checked_in")),
          )
          user = provider.get_user(session, os.environ.get("AGENTROUTER_USER_ID", ""))
          print(
              "oauth_user",
              "id=", user.get("id"),
              "quota=", user.get("quota"),
          )
          PY
