name: AgentRouter Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe public endpoints with Python
        shell: python
        run: |
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://agentrouter.org/console",
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/150.0.0.0 Safari/537.36"
              ),
          }
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(base + "/api/status", headers=headers)
              try:
                  response = urllib.request.urlopen(request, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "arg1=", "var arg1=" in body,
                  "prefix=", repr(body[:120]),
              )

      - name: Probe public endpoints with curl
        shell: bash
        run: |
          for base in https://agentrouter.org https://ps.air-outer.com; do
            echo "$base"
            curl --silent --show-error --compressed \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36' \
              --header 'Accept: application/json, text/plain, */*' \
              --referer "$base/console" \
              --dump-header - \
              --output response.txt \
              "$base/api/status"
            python -c "from pathlib import Path; body=Path('response.txt').read_text(encoding='utf-8', errors='replace'); print('length=', len(body), 'arg1=', 'var arg1=' in body, 'prefix=', repr(body[:120]))"
          done

      - name: Probe SSXMOD fingerprint cookies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --silent --show-error --location \
            https://raw.githubusercontent.com/xtekky/gpt4free/main/g4f/Provider/qwen/fingerprint.py \
            --output fingerprint.py
          curl --silent --show-error --location \
            https://raw.githubusercontent.com/xtekky/gpt4free/main/g4f/Provider/qwen/cookie_generator.py \
            --output cookie_generator.py
          sed -i '/from g4f import debug/d' cookie_generator.py
          sed -i 's/from g4f.Provider.qwen.fingerprint import generate_fingerprint/from fingerprint import generate_fingerprint/' cookie_generator.py
          python - <<'PY'
          import json
          import re
          import uuid
          import urllib.request
          from cookie_generator import generate_cookies

          generated = generate_cookies(
              fingerprint_options={"platform": "linux", "locale": "zh-CN"}
          )
          cookie = (
              f"ssxmod_itna={generated['ssxmod_itna']}; "
              f"ssxmod_itna2={generated['ssxmod_itna2']}"
          )
          wu_request = urllib.request.Request(
              "https://sg-wum.alibaba.com/w/wu.json",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          wu_body = urllib.request.urlopen(wu_request, timeout=20).read().decode(
              "utf-8", errors="replace"
          )
          token_match = re.search(r"(?:umx\.wu|__fycb)\('([^']+)'\)", wu_body)
          if not token_match:
              raise RuntimeError("Could not extract bx-umidtoken")
          umid_token = token_match.group(1)
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(
                  base + "/api/status",
                  headers={
                      "Accept": "application/json, text/plain, */*",
                      "Accept-Language": "zh-CN,zh;q=0.9",
                      "Cookie": cookie,
                      "Origin": base,
                      "Referer": base + "/console",
                      "Sec-Fetch-Dest": "empty",
                      "Sec-Fetch-Mode": "cors",
                      "Sec-Fetch-Site": "same-origin",
                      "User-Agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                          "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
                      ),
                      "X-Requested-With": "XMLHttpRequest",
                      "bx-umidtoken": umid_token,
                      "bx-v": "2.5.36",
                      "source": "web",
                      "version": "0.2.63",
                      "x-request-id": str(uuid.uuid4()),
                  },
              )
              response = urllib.request.urlopen(request, timeout=20)
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "json=", body.lstrip().startswith("{"),
                  "prefix=", repr(body[:120]),
              )
          PY

      - name: Probe with a real Chrome session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --quiet selenium
          xvfb-run -a python - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          options = Options()
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-blink-features=AutomationControlled")
          options.add_argument("--window-size=1920,1080")
          options.add_experimental_option("excludeSwitches", ["enable-automation"])
          driver = webdriver.Chrome(options=options)
          try:
              driver.execute_cdp_cmd(
                  "Page.addScriptToEvaluateOnNewDocument",
                  {
                      "source": (
                          "Object.defineProperty(navigator, 'webdriver', "
                          "{get: () => undefined})"
                      )
                  },
              )
              for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
                  driver.get(base + "/api/status")
                  for _ in range(15):
                      body = driver.find_element("tag name", "body").text
                      if body.lstrip().startswith("{"):
                          break
                      time.sleep(1)
                  cookies = [cookie["name"] for cookie in driver.get_cookies()]
                  print(
                      base,
                      "url=", driver.current_url,
                      "json=", body.lstrip().startswith("{"),
                      "length=", len(body),
                      "cookies=", sorted(cookies),
                      "prefix=", repr(body[:120]),
                  )
          finally:
              driver.quit()
          PY

      - name: Probe Claude Code client fingerprint
        if: runner.os == 'Linux'
        shell: python
        run: |
          import urllib.request

          headers = {
              "Accept": "application/json",
              "User-Agent": "claude-cli/2.1.119 (external, cli)",
              "x-app": "cli",
              "X-Stainless-Lang": "js",
              "X-Stainless-Runtime": "node",
              "X-Stainless-Runtime-Version": "v20.10.0",
              "X-Stainless-OS": "Linux",
              "X-Stainless-Arch": "x64",
              "X-Stainless-Package-Version": "0.39.0",
              "anthropic-version": "2023-06-01",
              "anthropic-beta": (
                  "interleaved-thinking-2025-05-14,"
                  "redact-thinking-2026-02-12,"
                  "context-management-2025-06-27,"
                  "prompt-caching-scope-2026-01-05,"
                  "claude-code-20250219"
              ),
              "anthropic-dangerous-direct-browser-access": "true",
          }
          for base in ("https://agentrouter.org", "https://ps.air-outer.com"):
              request = urllib.request.Request(base + "/api/status", headers=headers)
              response = urllib.request.urlopen(request, timeout=20)
              body = response.read().decode("utf-8", errors="replace")
              print(
                  base,
                  "status=", response.status,
                  "content_type=", response.headers.get("Content-Type"),
                  "length=", len(body),
                  "json=", body.lstrip().startswith("{"),
                  "prefix=", repr(body[:120]),
              )
